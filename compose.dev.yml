services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Set POSTGRES_DEV_PASSWORD for local development}
      POSTGRES_DB: oki_dive
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oki_dive"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
