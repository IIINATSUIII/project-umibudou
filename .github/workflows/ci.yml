name: CI

on:
  pull_request:
    branches: [main, codex/issue-57-staff-api-auth]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: oki_dive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oki_dive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI only needs non-secret values so the Next.js build can run.
      SESSION_SECRET: ci-only-session-secret-please-do-not-use
      STAFF_CREDENTIALS: ci@example.com:ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database migrations
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/oki_dive_test
        run: npm run db:migrate

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Create production build
        run: npm run build

      - name: Verify staff authentication over HTTP
        run: npm run test:security
